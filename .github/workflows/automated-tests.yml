name: Pruebas automáticas

on:
  push:
    paths:
      - "app/src/main/java/**"
      - "app/src/test/**"
      - "apps-script/**"
      - "firestore.rules"
      - "tools/test-*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/automated-tests.yml"
  pull_request:
    paths:
      - "app/src/main/java/**"
      - "app/src/test/**"
      - "apps-script/**"
      - "firestore.rules"
      - "tools/test-*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/automated-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install test dependencies
        run: npm ci
      - name: Create test-only Firebase configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "registro-guardias-ci",
              "storage_bucket": "registro-guardias-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.ejemplo.registroguardias"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci_test_key_not_connected_to_any_project"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Test Android logic
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Test Firestore rules and Sheets contract
        run: npm test
