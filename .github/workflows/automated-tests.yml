name: Pruebas automáticas

on:
  push:
    paths:
      - "app/src/main/java/**"
      - "app/src/test/**"
      - "apps-script/**"
      - "firestore.rules"
      - "tools/test-*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/automated-tests.yml"
  pull_request:
    paths:
      - "app/src/main/java/**"
      - "app/src/test/**"
      - "apps-script/**"
      - "firestore.rules"
      - "tools/test-*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/automated-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install test dependencies
        run: npm ci
      - name: Test Android logic
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Test Firestore rules and Sheets contract
        run: npm test
