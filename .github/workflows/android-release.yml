name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create private configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SHEETS_WEB_URL: ${{ secrets.SHEETS_WEB_URL }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for variable in GOOGLE_SERVICES_JSON SHEETS_WEB_URL SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: ${variable}"
              exit 1
            fi
          done
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > registro-guardia-release.jks
          printf 'sheets.web_url=%s\n' "$SHEETS_WEB_URL" > local.properties
          {
            printf 'storeFile=registro-guardia-release.jks\n'
            printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare release APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "Registro-de-Acceso-v${version}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-acceso-${{ github.run_number }}-release-apk
          path: Registro-de-Acceso-v*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Registro-de-Acceso-v${GITHUB_REF_NAME#v}.apk" \
            --title "Registro de Acceso $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -f registro-guardia-release.jks keystore.properties local.properties app/google-services.json
