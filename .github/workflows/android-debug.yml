name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing repository secret: GOOGLE_SERVICES_JSON"
            echo "Add the content of app/google-services.json as a GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-acceso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
