name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing repository secret: GOOGLE_SERVICES_JSON"
            echo "Add the content of app/google-services.json as a GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Add Firebase client for Llaves package
        run: |
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          data = json.loads(path.read_text())
          clients = data.get("client", [])
          target = "com.ejemplo.registroguardias.llaves"
          if clients and not any(
              client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name") == target
              for client in clients
          ):
              cloned = copy.deepcopy(clients[0])
              cloned.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = target
              clients.append(cloned)
              data["client"] = clients
              path.write_text(json.dumps(data, indent=2))
          PY

      - name: Create Sheets config
        run: |
          {
            echo 'sheets.url=https://script.google.com/macros/s/AKfycbyerApHKgpzWBr0fqZBXX0k_N6aoAyvHUsVatbtQU-H699ET8p2mckCrxlqUgxUW7If/exec'
            echo 'sheets.key='
          } > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-acceso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
