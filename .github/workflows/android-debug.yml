name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create private configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SHEETS_WEB_URL: ${{ secrets.SHEETS_WEB_URL }}
        run: |
          for variable in GOOGLE_SERVICES_JSON SHEETS_WEB_URL; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: ${variable}"
              exit 1
            fi
          done
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          {
            printf 'sheets.web_url=%s\n' "$SHEETS_WEB_URL"
          } > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-acceso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
