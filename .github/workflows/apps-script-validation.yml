name: Validar Apps Script

on:
  push:
    paths:
      - "apps-script/**"
      - "tools/test-apps-script-monthly-sheets.js"
      - ".github/workflows/apps-script-validation.yml"
  pull_request:
    paths:
      - "apps-script/**"
      - "tools/test-apps-script-monthly-sheets.js"
      - ".github/workflows/apps-script-validation.yml"
  workflow_dispatch:

jobs:
  monthly-sheets-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate monthly sheet destinations
        run: node tools/test-apps-script-monthly-sheets.js